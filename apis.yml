name: AirBand Communications
description: 'AirBand Communications, Inc. was a fixed-wireless broadband provider for business customers,
  founded in 2000 by Andy Lombard and headquartered in Dallas, Texas. It delivered high-speed data, Voice
  over IP, security and managed services over a last-mile fixed-wireless network, bypassing incumbent
  local phone companies, and operated in metropolitan markets including Baltimore, Dallas, Fort Worth,
  Houston, Philadelphia and Phoenix. The company was venture-backed, raising roughly $119M across sixteen
  rounds from investors including Battery Ventures, M/C Partners and Crescendo Ventures, and grew by acquiring
  the fixed-wireless business of WindChannel Communications (2006) and Sparkplug (2010). Airband was acquired
  by United Network Services (UNSi) on 2013-05-15 and no longer operates independently. As of the 2026-07-19
  enrichment pass its former domains (airband.com, www.airband.com, airbandcommunications.com) do not resolve
  (DNS NXDOMAIN), and no developer portal, API documentation, or machine-readable API artifacts of any kind
  could be found. This company is retained in the network as a historical/defunct record only. Not to be
  confused with Airband Community Internet, an unrelated UK rural broadband operator.'
